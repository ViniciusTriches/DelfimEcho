<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F1E8">
<title>Sem conexão · Echo</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<script>
  // Mesmo tema do app (next-themes guarda a escolha em "theme"; o padrão é claro).
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
</script>
<style>
  :root { --fundo: #F8F1E8; --cartao: #F5EBDC; --texto: #2D2A24; --texto-2: #514B3D; --primaria: #2D6860; --na-primaria: #FFFAF6; }
  .dark { --fundo: #1D1A15; --cartao: #232019; --texto: #EBE4DB; --texto-2: #C9C0AF; --primaria: #97D2C9; --na-primaria: #003732; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; background: var(--fundo); color: var(--texto);
    font: 16px/1.5 "Roboto Flex", ui-sans-serif, system-ui, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 26rem; background: var(--cartao); border-radius: 16px; padding: 32px 24px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
  svg { width: 56px; height: 56px; color: var(--primaria); }
  h1 { margin: 0; font-size: 1.5rem; line-height: 2rem; font-weight: 400; }
  p { margin: 0; color: var(--texto-2); }
  button {
    margin-top: 8px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 9999px; cursor: pointer;
    background: var(--primaria); color: var(--na-primaria); font: 500 0.875rem/1.25rem inherit; font-family: inherit; letter-spacing: 0.00625rem;
  }
  button:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="5" cy="12" r="2.25" fill="currentColor"/>
    <path d="M10 7.5a6.5 6.5 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 4.5a10.5 10.5 0 0 1 0 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/>
    <path d="M18 2a14 14 0 0 1 0 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".25"/>
  </svg>
  <h1>Sem conexão</h1>
  <p>O Echo mostra sempre os dados atualizados, então precisa de internet. Quando a conexão voltar, a tela recarrega sozinha.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
<script>
  addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
